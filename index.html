<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Dirty Tokens — 异常词元研究</title>
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<style>
@font-face {
  font-family: 'Instrument Sans';
  src: url('./_shared/fonts/InstrumentSans-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'Instrument Sans';
  src: url('./_shared/fonts/InstrumentSans-Bold.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
}
@font-face {
  font-family: 'JetBrains Mono';
  src: url('./_shared/fonts/JetBrainsMono-Regular.ttf') format('truetype');
  font-weight: 400;
  font-style: normal;
}
@font-face {
  font-family: 'JetBrains Mono';
  src: url('./_shared/fonts/JetBrainsMono-Bold.ttf') format('truetype');
  font-weight: 700;
  font-style: normal;
}

:root {
  --bg: #0c0e14;
  --bg2: #161922;
  --bg3: #1e2230;
  --ink: #e8e9ed;
  --muted: #8b8fa3;
  --rule: #2a2e3d;
  --accent: #818cf8;
  --accent2: #f472b6;
  --accent3: #34d399;
  --danger: #f87171;
  --warning: #fbbf24;
}

* { margin: 0; padding: 0; box-sizing: border-box; }
html { scroll-behavior: smooth; }

body {
  font-family: 'Instrument Sans', -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif;
  background: var(--bg);
  color: var(--ink);
  font-size: 16px;
  line-height: 1.75;
  -webkit-font-smoothing: antialiased;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
}

/* Hero */
.hero {
  position: relative;
  padding: 6rem 0 4rem;
  text-align: center;
  overflow: hidden;
  border-bottom: 1px solid var(--rule);
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}
.hero::before {
  content: '';
  position: absolute;
  top: -50%;
  left: -50%;
  width: 200%;
  height: 200%;
  background:
    radial-gradient(ellipse at 30% 20%, rgba(129,140,248,0.12) 0%, transparent 50%),
    radial-gradient(ellipse at 70% 80%, rgba(244,114,182,0.08) 0%, transparent 50%);
  pointer-events: none;
}

.container {
  max-width: 920px;
  margin: 0 auto;
  padding: 0 1.5rem;
  position: relative;
  z-index: 1;
}

.hero-badge {
  display: inline-block;
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.75rem;
  letter-spacing: 0.15em;
  text-transform: uppercase;
  color: var(--accent);
  border: 1px solid var(--accent);
  padding: 0.3rem 0.8rem;
  border-radius: 100px;
  margin-bottom: 1.5rem;
}

.hero h1 {
  font-size: clamp(2.2rem, 5vw, 3.5rem);
  font-weight: 700;
  line-height: 1.2;
  margin-bottom: 0.5rem;
  letter-spacing: -0.02em;
}
.hero h1 .highlight {
  background: linear-gradient(135deg, var(--accent), var(--accent2));
  -webkit-background-clip: text;
  -webkit-text-fill-color: transparent;
  background-clip: text;
}

.hero .subtitle {
  font-size: 1.15rem;
  color: var(--muted);
  max-width: 600px;
  margin: 0 auto 0.5rem;
}

.hero .subtitle-en {
  font-size: 0.9rem;
  color: var(--muted);
  opacity: 0.6;
  max-width: 500px;
  margin: 0 auto 3rem;
}

/* Cards */
.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 1.5rem;
  margin: 0 auto;
  max-width: 760px;
}

.card {
  background: var(--bg2);
  border: 1px solid var(--rule);
  border-radius: 12px;
  padding: 2rem 1.75rem;
  text-decoration: none;
  color: var(--ink);
  transition: border-color 0.3s, transform 0.3s, box-shadow 0.3s;
  display: flex;
  flex-direction: column;
}
.card:hover {
  border-color: var(--accent);
  transform: translateY(-4px);
  box-shadow: 0 8px 30px rgba(129,140,248,0.12);
}

.card-icon {
  font-size: 2rem;
  margin-bottom: 1rem;
}

.card-title {
  font-size: 1.25rem;
  font-weight: 700;
  margin-bottom: 0.5rem;
  color: var(--ink);
}

.card-desc {
  font-size: 0.9rem;
  color: var(--muted);
  line-height: 1.65;
  flex: 1;
  margin-bottom: 1rem;
}

.card-link {
  font-family: 'JetBrains Mono', monospace;
  font-size: 0.8rem;
  color: var(--accent);
  font-weight: 600;
  letter-spacing: 0.03em;
}
.card:hover .card-link {
  text-decoration: underline;
}

/* Footer */
footer {
  padding: 2rem 0 2.5rem;
  border-top: 1px solid var(--rule);
  text-align: center;
  margin-top: 3rem;
}
footer p {
  font-size: 0.85rem;
  color: var(--muted);
}
footer a {
  color: var(--accent);
  text-decoration: none;
}
footer a:hover {
  text-decoration: underline;
}

/* Responsive */
@media (max-width: 640px) {
  .hero { padding: 4rem 0 3rem; }
  .cards { grid-template-columns: 1fr; }
}
</style>
</head>
<body>

<!-- Hero -->
<header class="hero">
  <div class="container">
    <div class="hero-badge">Research + Generative Art · 2026</div>
    <h1><span class="highlight">Dirty Tokens</span></h1>
    <p class="subtitle">为何异常词元会让大模型输出错乱</p>
    <p class="subtitle-en">Why Anomalous Tokens Break Large Language Models</p>

    <div class="cards">
      <a href="glitch-tokens-research.html" class="card">
        <div class="card-icon">🔬</div>
        <div class="card-title">研究报告</div>
        <div class="card-desc">15 个案例解析、7 大技术机制、5 篇核心论文、MiniMax"马嘉祺"事件深度复盘——系统性解析 Glitch Token 的分类、原理与修复方法。</div>
        <div class="card-link">阅读报告 →</div>
      </a>
      <a href="entropic-fragmentation.html" class="card">
        <div class="card-icon">🎨</div>
        <div class="card-title">熵增碎片化</div>
        <div class="card-desc">交互式生成艺术作品——用粒子流与噪声场可视化词元腐败与信息衰减，探索有序与混沌的边界。</div>
        <div class="card-link">体验作品 →</div>
      </a>
    </div>
  </div>
</header>

<footer>
  <div class="container">
    <p>伴读哲学随笔：<a href="entropic-fragmentation.md">《熵增碎片化》算法哲学</a></p>
  </div>
</footer>

</body>
</html>
