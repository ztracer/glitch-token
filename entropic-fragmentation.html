<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
    <title>Entropic Fragmentation — Generative Art</title>
    <script src="./_shared/js/p5.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&family=Lora:wght@400;500&display=swap" rel="stylesheet">
    <style>
        :root {
            --anthropic-dark: #141413;
            --anthropic-light: #faf9f5;
            --anthropic-mid-gray: #b0aea5;
            --anthropic-light-gray: #e8e6dc;
            --anthropic-orange: #d97757;
            --anthropic-blue: #6a9bcc;
            --anthropic-green: #788c5d;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Poppins', sans-serif;
            background: linear-gradient(135deg, var(--anthropic-light) 0%, #f5f3ee 100%);
            min-height: 100vh;
            color: var(--anthropic-dark);
        }

        .container {
            display: flex;
            min-height: 100vh;
            padding: 20px;
            gap: 20px;
        }

        .sidebar {
            width: 320px;
            flex-shrink: 0;
            background: rgba(255, 255, 255, 0.95);
            backdrop-filter: blur(10px);
            padding: 24px;
            border-radius: 12px;
            box-shadow: 0 10px 30px rgba(20, 20, 19, 0.1);
            overflow-y: auto;
            overflow-x: hidden;
        }

        .sidebar h1 {
            font-family: 'Lora', serif;
            font-size: 24px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .sidebar .subtitle {
            color: var(--anthropic-mid-gray);
            font-size: 14px;
            margin-bottom: 32px;
            line-height: 1.4;
        }

        .control-section {
            margin-bottom: 32px;
        }

        .control-section h3 {
            font-size: 16px;
            font-weight: 600;
            color: var(--anthropic-dark);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .control-section h3::before {
            content: '•';
            color: var(--anthropic-orange);
            font-weight: bold;
        }

        .seed-input {
            width: 100%;
            background: var(--anthropic-light);
            padding: 12px;
            border-radius: 8px;
            font-family: 'Courier New', monospace;
            font-size: 14px;
            margin-bottom: 12px;
            border: 1px solid var(--anthropic-light-gray);
            text-align: center;
        }

        .seed-input:focus {
            outline: none;
            border-color: var(--anthropic-orange);
            box-shadow: 0 0 0 2px rgba(217, 119, 87, 0.1);
            background: white;
        }

        .seed-controls {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            margin-bottom: 8px;
        }

        .regen-button {
            margin-bottom: 0;
        }

        .control-group {
            margin-bottom: 20px;
        }

        .control-group label {
            display: block;
            font-size: 14px;
            font-weight: 500;
            color: var(--anthropic-dark);
            margin-bottom: 8px;
        }

        .slider-container {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .slider-container input[type="range"] {
            flex: 1;
            height: 4px;
            background: var(--anthropic-light-gray);
            border-radius: 2px;
            outline: none;
            -webkit-appearance: none;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb {
            -webkit-appearance: none;
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .slider-container input[type="range"]::-webkit-slider-thumb:hover {
            transform: scale(1.1);
            background: #c86641;
        }

        .slider-container input[type="range"]::-moz-range-thumb {
            width: 16px;
            height: 16px;
            background: var(--anthropic-orange);
            border-radius: 50%;
            border: none;
            cursor: pointer;
            transition: all 0.2s ease;
        }

        .value-display {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            min-width: 60px;
            text-align: right;
        }

        .color-group {
            margin-bottom: 16px;
        }

        .color-group label {
            display: block;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
            margin-bottom: 4px;
        }

        .color-picker-container {
            display: flex;
            align-items: center;
            gap: 8px;
        }

        .color-picker-container input[type="color"] {
            width: 32px;
            height: 32px;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            background: none;
            padding: 0;
        }

        .color-value {
            font-family: 'Courier New', monospace;
            font-size: 12px;
            color: var(--anthropic-mid-gray);
        }

        .button {
            background: var(--anthropic-orange);
            color: white;
            border: none;
            padding: 10px 16px;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: all 0.2s ease;
            width: 100%;
        }

        .button:hover {
            background: #c86641;
            transform: translateY(-1px);
        }

        .button:active {
            transform: translateY(0);
        }

        .button.secondary {
            background: var(--anthropic-blue);
        }

        .button.secondary:hover {
            background: #5a8bb8;
        }

        .button.tertiary {
            background: var(--anthropic-green);
        }

        .button.tertiary:hover {
            background: #6b7b52;
        }

        .button-row {
            display: flex;
            gap: 8px;
        }

        .button-row .button {
            flex: 1;
        }

        .canvas-area {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 0;
        }

        #canvas-container {
            width: 100%;
            max-width: 1000px;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 40px rgba(20, 20, 19, 0.1);
            background: white;
        }

        #canvas-container canvas {
            display: block;
            width: 100% !important;
            height: auto !important;
        }

        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
            color: var(--anthropic-mid-gray);
        }

        @media (max-width: 600px) {
            .container { flex-direction: column; }
            .sidebar { width: 100%; }
            .canvas-area { padding: 20px; }
        }
    </style>
</head>
<body>
    <nav style="position:sticky;top:0;z-index:1000;background:rgba(12,14,20,0.95);backdrop-filter:blur(12px);padding:0.5rem 1.5rem;display:flex;gap:1.5rem;align-items:center;border-bottom:1px solid rgba(255,255,255,0.08);font-size:0.85rem;">
        <a href="index.html" style="color:#818cf8;text-decoration:none;font-weight:600;">← Dirty Tokens</a>
        <a href="glitch-tokens-research.html" style="color:#8b8fa3;text-decoration:none;">Research</a>
        <a href="entropic-fragmentation.html" style="color:#8b8fa3;text-decoration:none;">Art</a>
    </nav>
    <div class="container">
        <div class="sidebar">
            <h1>Entropic Fragmentation</h1>
            <div class="subtitle">信息碎裂的算法美学 — 有序与混沌的边界</div>

            <div class="control-section">
                <h3>Seed</h3>
                <input type="number" id="seed-input" class="seed-input" value="42" onchange="updateSeed()">
                <div class="seed-controls">
                    <button class="button secondary" onclick="previousSeed()">← Prev</button>
                    <button class="button secondary" onclick="nextSeed()">Next →</button>
                </div>
                <button class="button tertiary regen-button" onclick="randomSeedAndUpdate()">↻ Random</button>
            </div>

            <div class="control-section">
                <h3>Parameters</h3>

                <div class="control-group">
                    <label>Particle Count</label>
                    <div class="slider-container">
                        <input type="range" id="particleCount" min="500" max="8000" step="100" value="3000" oninput="updateParam('particleCount', this.value)">
                        <span class="value-display" id="particleCount-value">3000</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Corruption Rate</label>
                    <div class="slider-container">
                        <input type="range" id="corruptionRate" min="0.001" max="0.05" step="0.001" value="0.008" oninput="updateParam('corruptionRate', this.value)">
                        <span class="value-display" id="corruptionRate-value">0.008</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Fragmentation Depth</label>
                    <div class="slider-container">
                        <input type="range" id="fragmentationDepth" min="0" max="3" step="1" value="2" oninput="updateParam('fragmentationDepth', this.value)">
                        <span class="value-display" id="fragmentationDepth-value">2</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Noise Turbulence</label>
                    <div class="slider-container">
                        <input type="range" id="noiseTurbulence" min="1" max="8" step="1" value="4" oninput="updateParam('noiseTurbulence', this.value)">
                        <span class="value-display" id="noiseTurbulence-value">4</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Trail Persistence</label>
                    <div class="slider-container">
                        <input type="range" id="trailPersistence" min="2" max="30" step="1" value="12" oninput="updateParam('trailPersistence', this.value)">
                        <span class="value-display" id="trailPersistence-value">12</span>
                    </div>
                </div>

                <div class="control-group">
                    <label>Flow Speed</label>
                    <div class="slider-container">
                        <input type="range" id="flowSpeed" min="0.3" max="3.0" step="0.1" value="1.2" oninput="updateParam('flowSpeed', this.value)">
                        <span class="value-display" id="flowSpeed-value">1.2</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Colors</h3>
                <div class="color-group">
                    <label>Order (Cool)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color1" value="#4a90d9" onchange="updateColor('color1', this.value)">
                        <span class="color-value" id="color1-value">#4a90d9</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Transition (Purple)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color2" value="#9b6bcc" onchange="updateColor('color2', this.value)">
                        <span class="color-value" id="color2-value">#9b6bcc</span>
                    </div>
                </div>
                <div class="color-group">
                    <label>Entropy (Warm)</label>
                    <div class="color-picker-container">
                        <input type="color" id="color3" value="#d97757" onchange="updateColor('color3', this.value)">
                        <span class="color-value" id="color3-value">#d97757</span>
                    </div>
                </div>
            </div>

            <div class="control-section">
                <h3>Actions</h3>
                <div class="button-row">
                    <button class="button" onclick="resetParameters()">Reset</button>
                    <button class="button secondary" onclick="downloadPNG()">Download PNG</button>
                </div>
            </div>

            <div class="control-section">
                <h3>关于</h3>
                <a href="entropic-fragmentation-essay.html" style="color:var(--anthropic-orange);font-size:14px;">阅读算法哲学 →</a>
            </div>
        </div>

        <div class="canvas-area">
            <div id="canvas-container">
                <div class="loading">Initializing generative art...</div>
            </div>
        </div>
    </div>

    <script>
        let params = {
            seed: 42,
            particleCount: 3000,
            corruptionRate: 0.008,
            fragmentationDepth: 2,
            noiseTurbulence: 4,
            trailPersistence: 12,
            flowSpeed: 1.2,
            colorPalette: ['#4a90d9', '#9b6bcc', '#d97757']
        };

        let defaultParams = JSON.parse(JSON.stringify(params));

        let particles = [];
        let fragments = [];
        let timeOffset = 0;
        let cols, rows;
        let scl = 15;
        let bgGraphics;

        function setup() {
            let canvas = createCanvas(1200, 1200);
            canvas.parent('canvas-container');
            bgGraphics = createGraphics(width, height);
            initializeSystem();
            document.querySelector('.loading').style.display = 'none';
        }

        function initializeSystem() {
            randomSeed(params.seed);
            noiseSeed(params.seed);
            timeOffset = 0;

            particles = [];
            fragments = [];

            let gridCols = floor(sqrt(params.particleCount));
            let gridRows = floor(params.particleCount / gridCols);
            let spacingX = width / (gridCols + 1);
            let spacingY = height / (gridRows + 1);

            for (let i = 0; i < params.particleCount; i++) {
                let col = i % gridCols;
                let row = floor(i / gridCols);
                let x = (col + 1) * spacingX + random(-spacingX * 0.3, spacingX * 0.3);
                let y = (row + 1) * spacingY + random(-spacingY * 0.3, spacingY * 0.3);
                particles.push(new DataParticle(x, y, 0));
            }

            bgGraphics.clear();
            bgGraphics.background(250, 249, 245, 255);

            cols = floor(width / scl);
            rows = floor(height / scl);
        }

        function draw() {
            timeOffset += 0.003 * params.flowSpeed;

            let fadeAlpha = map(params.trailPersistence, 2, 30, 8, 35);
            bgGraphics.noStroke();
            bgGraphics.fill(250, 249, 245, fadeAlpha);
            bgGraphics.rect(0, 0, width, height);

            let allEntities = particles.concat(fragments);

            for (let p of allEntities) {
                p.update();
                p.display(bgGraphics);
            }

            image(bgGraphics, 0, 0);

            let newFragments = [];
            for (let p of allEntities) {
                if (p.integrity > 0 && p.canFragment() && p.generation < params.fragmentationDepth) {
                    let children = p.fragment();
                    newFragments = newFragments.concat(children);
                }
            }
            fragments = fragments.concat(newFragments);

            fragments = fragments.filter(f => f.alive);
            particles = particles.filter(p => p.alive);
        }

        function getFlowVector(x, y, z) {
            let scale = 0.003 * (params.noiseTurbulence / 4);
            let angle = noise(x * scale, y * scale, z) * TWO_PI * 2;
            let strength = noise(x * scale + 1000, y * scale + 1000, z);
            return p5.Vector.fromAngle(angle).mult(strength * params.flowSpeed);
        }

        function getLocalNoiseIntensity(x, y, z) {
            let scale = 0.005;
            let intensity = 0;
            for (let o = 0; o < params.noiseTurbulence; o++) {
                let os = scale * pow(2, o);
                intensity += noise(x * os, y * os, z + o * 10) / pow(2, o);
            }
            return intensity / params.noiseTurbulence;
        }

        function lerpColor3(c1, c2, c3, t) {
            let r, g, b;
            if (t < 0.5) {
                let localT = t * 2;
                r = red(c1) + (red(c2) - red(c1)) * localT;
                g = green(c1) + (green(c2) - green(c1)) * localT;
                b = blue(c1) + (blue(c2) - blue(c1)) * localT;
            } else {
                let localT = (t - 0.5) * 2;
                r = red(c2) + (red(c3) - red(c2)) * localT;
                g = green(c2) + (green(c3) - green(c2)) * localT;
                b = blue(c2) + (blue(c3) - blue(c2)) * localT;
            }
            return color(r, g, b);
        }

        class DataParticle {
            constructor(x, y, generation) {
                this.pos = createVector(x, y);
                this.vel = createVector(0, 0);
                this.acc = createVector(0, 0);
                this.integrity = 1.0;
                this.generation = generation;
                this.alive = true;
                this.maxSpeed = (2.0 + generation * 1.5) * params.flowSpeed;
                this.size = map(generation, 0, 3, 2.5, 0.8);
                this.trail = [];
                this.fragmented = false;
            }

            update() {
                let flow = getFlowVector(this.pos.x, this.pos.y, timeOffset);
                let noiseIntensity = getLocalNoiseIntensity(this.pos.x, this.pos.y, timeOffset);

                this.acc.add(flow);

                if (noiseIntensity > 0.55) {
                    let decayAmount = params.corruptionRate * (1 + noiseIntensity * 3) * (1 + this.generation * 0.5);
                    this.integrity -= decayAmount;
                }

                this.integrity = constrain(this.integrity, 0, 1);

                this.vel.add(this.acc);
                this.vel.limit(this.maxSpeed);
                this.pos.add(this.vel);
                this.acc.mult(0);

                this.trail.push({x: this.pos.x, y: this.pos.y});
                if (this.trail.length > params.trailPersistence) {
                    this.trail.shift();
                }

                if (this.pos.x < -10 || this.pos.x > width + 10 ||
                    this.pos.y < -10 || this.pos.y > height + 10) {
                    this.alive = false;
                }

                if (this.integrity <= 0 && !this.fragmented) {
                    this.alive = false;
                }
            }

            display(g) {
                let col = lerpColor3(
                    color(params.colorPalette[0]),
                    color(params.colorPalette[1]),
                    color(params.colorPalette[2]),
                    1 - this.integrity
                );

                let alpha = map(this.integrity, 0, 1, 40, 180);
                let displaySize = this.size * (0.5 + this.integrity * 0.5);

                if (this.trail.length > 1) {
                    g.noFill();
                    g.strokeWeight(displaySize * 0.6);
                    for (let i = 1; i < this.trail.length; i++) {
                        let trailAlpha = alpha * (i / this.trail.length) * 0.5;
                        g.stroke(red(col), green(col), blue(col), trailAlpha);
                        g.line(this.trail[i-1].x, this.trail[i-1].y, this.trail[i].x, this.trail[i].y);
                    }
                }

                g.noStroke();
                g.fill(red(col), green(col), blue(col), alpha);
                g.ellipse(this.pos.x, this.pos.y, displaySize * 2, displaySize * 2);

                if (this.integrity < 0.4 && this.integrity > 0) {
                    g.fill(red(col), green(col), blue(col), alpha * 0.3);
                    g.ellipse(this.pos.x, this.pos.y, displaySize * 6, displaySize * 6);
                }
            }

            canFragment() {
                return this.integrity < 0.35 && !this.fragmented && this.generation < params.fragmentationDepth;
            }

            fragment() {
                this.fragmented = true;
                let children = [];
                let numChildren = floor(random(2, 5));
                for (let i = 0; i < numChildren; i++) {
                    let child = new DataParticle(this.pos.x, this.pos.y, this.generation + 1);
                    let angle = random(TWO_PI);
                    let speed = random(0.5, 2.0) * params.flowSpeed;
                    child.vel = p5.Vector.fromAngle(angle).mult(speed);
                    child.integrity = random(0.3, 0.6);
                    children.push(child);
                }
                return children;
            }
        }

        function updateParam(paramName, value) {
            let numVal = parseFloat(value);
            params[paramName] = numVal;
            document.getElementById(paramName + '-value').textContent = value;
            if (paramName === 'particleCount' || paramName === 'noiseTurbulence') {
                initializeSystem();
            }
        }

        function updateColor(colorId, value) {
            let idx = parseInt(colorId.replace('color', '')) - 1;
            params.colorPalette[idx] = value;
            document.getElementById(colorId + '-value').textContent = value;
        }

        function updateSeedDisplay() {
            document.getElementById('seed-input').value = params.seed;
        }

        function updateSeed() {
            let input = document.getElementById('seed-input');
            let newSeed = parseInt(input.value);
            if (newSeed && newSeed > 0) {
                params.seed = newSeed;
                initializeSystem();
            } else {
                updateSeedDisplay();
            }
        }

        function previousSeed() {
            params.seed = Math.max(1, params.seed - 1);
            updateSeedDisplay();
            initializeSystem();
        }

        function nextSeed() {
            params.seed = params.seed + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function randomSeedAndUpdate() {
            params.seed = Math.floor(Math.random() * 999999) + 1;
            updateSeedDisplay();
            initializeSystem();
        }

        function resetParameters() {
            params = JSON.parse(JSON.stringify(defaultParams));

            document.getElementById('particleCount').value = params.particleCount;
            document.getElementById('particleCount-value').textContent = params.particleCount;
            document.getElementById('corruptionRate').value = params.corruptionRate;
            document.getElementById('corruptionRate-value').textContent = params.corruptionRate;
            document.getElementById('fragmentationDepth').value = params.fragmentationDepth;
            document.getElementById('fragmentationDepth-value').textContent = params.fragmentationDepth;
            document.getElementById('noiseTurbulence').value = params.noiseTurbulence;
            document.getElementById('noiseTurbulence-value').textContent = params.noiseTurbulence;
            document.getElementById('trailPersistence').value = params.trailPersistence;
            document.getElementById('trailPersistence-value').textContent = params.trailPersistence;
            document.getElementById('flowSpeed').value = params.flowSpeed;
            document.getElementById('flowSpeed-value').textContent = params.flowSpeed;

            document.getElementById('color1').value = params.colorPalette[0];
            document.getElementById('color1-value').textContent = params.colorPalette[0];
            document.getElementById('color2').value = params.colorPalette[1];
            document.getElementById('color2-value').textContent = params.colorPalette[1];
            document.getElementById('color3').value = params.colorPalette[2];
            document.getElementById('color3-value').textContent = params.colorPalette[2];

            updateSeedDisplay();
            initializeSystem();
        }

        function downloadPNG() {
            saveCanvas('entropic-fragmentation-seed-' + params.seed, 'png');
        }

        window.addEventListener('load', function() {
            updateSeedDisplay();
        });
    </script>
</body>
</html>
